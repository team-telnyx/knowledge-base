# Telnyx platform service metadata (source repo).
# Spec: https://platform-handbook.internal.telnyx.com/decision_record/architecture/padr-0001_service_metadata_spec/

names:
  service: knowledge-base-oci
  github: knowledge-base

project:
  squad: ai.troubleshooting.squad
  primary_maintainer: jakubo
  public_api: false
  private_api: false

build:
  promote_to_dev:
    mode: always
  # This image has no ArgoCD service of its own — it is a content-only
  # artifact consumed at build time. The prod-promote step's ArgoCD health
  # check is graceful on missing services (metadata-DB query returns zero
  # rows → step exits success → promote-to-prod proceeds).
  promote_to_prod:
    mode: always
