name: Monthly Dev Docs LLMWiki Refresh

on:
  schedule:
    # First Sunday of each month, after support-docs refresh.
    - cron: "47 8 1-7 * 0"
  workflow_dispatch:
    inputs:
      llmwiki_ref:
        description: "LLMWiki git ref to run"
        required: false
        default: "main"
      max_pages:
        description: "Max developers.telnyx.com pages to scrape"
        required: false
        default: "5000"
      max_workers:
        description: "Concurrent LLM synthesis workers"
        required: false
        default: "4"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-dev-docs-llmwiki-refresh
  cancel-in-progress: false

env:
  LLMWIKI_REPO: team-telnyx/LLMWiki
  LLMWIKI_REF: ${{ inputs.llmwiki_ref || 'main' }}
  MAX_PAGES: ${{ inputs.max_pages || '5000' }}
  MAX_WORKERS: ${{ inputs.max_workers || '4' }}

jobs:
  dev-docs-refresh:
    name: Scrape and full compile dev-docs workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout knowledge-base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Checkout latest LLMWiki compiler
        shell: bash
        env:
          LLMWIKI_TOKEN: ${{ secrets.LLMWIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLMWIKI_REF" \
            "https://x-access-token:${LLMWIKI_TOKEN}@github.com/${LLMWIKI_REPO}.git" \
            ../LLMWiki
          git -C ../LLMWiki rev-parse HEAD | tee llmwiki-compiler-sha.txt

      - name: Install LLMWiki dependencies
        working-directory: ../LLMWiki
        run: uv sync

      - name: Scrape developers.telnyx.com source snapshot
        working-directory: ../LLMWiki
        run: |
          set -euo pipefail
          uv run wiki scrape \
            --source dev-docs \
            --max-pages "$MAX_PAGES" \
            2>&1 | tee ../knowledge-base/dev-scrape.log

      - name: Full compile dev-docs with LLMWiki
        working-directory: ../LLMWiki
        env:
          LITELLM_PROXY_API_KEY: ${{ secrets.LITELLM_PROXY_API_KEY }}
          LITELLM_PROXY_API_BASE: ${{ secrets.LITELLM_PROXY_API_BASE }}
          LLM_PROXY_MODEL_DEFAULT: ${{ secrets.LLM_PROXY_MODEL_DEFAULT }}
        run: |
          set -euo pipefail
          rm -rf dist/wiki wikis/dev-docs/.work
          uv run wiki compile \
            --wiki-name dev-docs \
            --grouping area \
            --max-workers "$MAX_WORKERS" \
            2>&1 | tee ../knowledge-base/dev-compile.log

      - name: Strip volatile content hashlines
        run: |
          python scripts/monthly_llmwiki_refresh.py strip-content-hashlines \
            --path ../LLMWiki/dist/wiki/dev-docs | tee dev-strip-hashlines.json

      - name: Install compiled dev-docs workspace
        run: |
          python scripts/monthly_llmwiki_refresh.py install-workspace \
            --workspace dev-docs \
            --compiled-wiki-root ../LLMWiki/dist/wiki \
            --wiki-root wiki | tee dev-install.json
          python scripts/monthly_llmwiki_refresh.py rebuild-root-index \
            --wiki-root wiki | tee dev-root-index.json

      - name: Build PR summary
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          SCRAPED_COUNT=$(find ../LLMWiki/wikis/dev-docs/sources/dev-docs -name '*.md' | wc -l | tr -d ' ')
          {
            echo "## Summary"
            echo "- Scraped developers.telnyx.com with LLMWiki, then full-recompiled the dev-docs corpus only."
            echo "- Pulled compiler from \`${LLMWIKI_REPO}@${LLMWIKI_REF}\`."
            echo "- Scraped \`${SCRAPED_COUNT}\` Markdown source pages."
            echo "- Stripped generated \`content_hash:\` hashlines before committing, per David O'Connell's recommendation."
            echo "- Rebuilt \`wiki/index.md\` from workspace indexes while preserving support-docs entries."
            echo
            echo "## Compiler SHA"
            echo '```'
            cat llmwiki-compiler-sha.txt
            echo '```'
            echo
            echo "## Diff stat"
            echo '```'
            git diff --stat -- wiki || true
            echo '```'
          } > pr-body.md
          if git diff --quiet -- wiki; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open monthly dev-docs refresh PR
        if: steps.summary.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/monthly-dev-docs-llmwiki-refresh-$(date -u +%Y-%m)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add wiki
          git commit -m "docs: monthly dev docs LLMWiki refresh"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: monthly dev docs LLMWiki refresh" \
            --body-file pr-body.md

      - name: No corpus changes
        if: steps.summary.outputs.has_changes != 'true'
        run: echo "No dev-docs wiki changes to publish."
