name: Monthly Support Docs LLMWiki Refresh

on:
  schedule:
    # First Sunday of each month, odd minute to avoid GitHub's top-of-hour cron rush.
    - cron: "23 7 1-7 * 0"
  workflow_dispatch:
    inputs:
      llmwiki_ref:
        description: "LLMWiki git ref to run"
        required: false
        default: "main"
      max_workers:
        description: "Concurrent LLM synthesis workers"
        required: false
        default: "4"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-support-docs-llmwiki-refresh
  cancel-in-progress: false

env:
  LLMWIKI_REPO: team-telnyx/LLMWiki
  LLMWIKI_REF: ${{ inputs.llmwiki_ref || 'main' }}
  MAX_WORKERS: ${{ inputs.max_workers || '4' }}

jobs:
  support-docs-refresh:
    name: Full compile support-docs workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout knowledge-base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Checkout latest LLMWiki compiler
        shell: bash
        env:
          LLMWIKI_TOKEN: ${{ secrets.LLMWIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLMWIKI_REF" \
            "https://x-access-token:${LLMWIKI_TOKEN}@github.com/${LLMWIKI_REPO}.git" \
            ../LLMWiki
          git -C ../LLMWiki rev-parse HEAD | tee llmwiki-compiler-sha.txt

      - name: Install LLMWiki dependencies
        working-directory: ../LLMWiki
        run: uv sync

      - name: Prepare support-docs source snapshot for compiler
        run: |
          python scripts/monthly_llmwiki_refresh.py prepare-support-sources \
            --source-root support-docs \
            --llmwiki-dir ../LLMWiki | tee support-source-prep.json

      - name: Full compile support-docs with LLMWiki
        working-directory: ../LLMWiki
        env:
          LITELLM_PROXY_API_KEY: ${{ secrets.LITELLM_PROXY_API_KEY }}
          LITELLM_PROXY_API_BASE: ${{ secrets.LITELLM_PROXY_API_BASE }}
          LLM_PROXY_MODEL_DEFAULT: ${{ secrets.LLM_PROXY_MODEL_DEFAULT }}
        run: |
          set -euo pipefail
          rm -rf dist/wiki wikis/support-docs/.work
          uv run wiki compile \
            --wiki-name support-docs \
            --grouping llm \
            --max-workers "$MAX_WORKERS" \
            2>&1 | tee ../knowledge-base/support-compile.log

      - name: Strip volatile content hashlines
        run: |
          python scripts/monthly_llmwiki_refresh.py strip-content-hashlines \
            --path ../LLMWiki/dist/wiki/support-docs | tee support-strip-hashlines.json

      - name: Install compiled support-docs workspace
        run: |
          python scripts/monthly_llmwiki_refresh.py install-workspace \
            --workspace support-docs \
            --compiled-wiki-root ../LLMWiki/dist/wiki \
            --wiki-root wiki | tee support-install.json
          python scripts/monthly_llmwiki_refresh.py rebuild-root-index \
            --wiki-root wiki | tee support-root-index.json

      - name: Build PR summary
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Summary"
            echo "- Full LLMWiki recompile for the checked-in support-docs corpus only."
            echo "- Pulled compiler from \`${LLMWIKI_REPO}@${LLMWIKI_REF}\`."
            echo "- Stripped generated \`content_hash:\` hashlines before committing, per David O'Connell's recommendation."
            echo "- Rebuilt \`wiki/index.md\` from workspace indexes while preserving dev-docs entries."
            echo
            echo "## Compiler SHA"
            echo '```'
            cat llmwiki-compiler-sha.txt
            echo '```'
            echo
            echo "## Diff stat"
            echo '```'
            git diff --stat -- wiki || true
            echo '```'
          } > pr-body.md
          if git diff --quiet -- wiki; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open monthly support-docs refresh PR
        if: steps.summary.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/monthly-support-docs-llmwiki-refresh-$(date -u +%Y-%m)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add wiki
          git commit -m "docs: monthly support docs LLMWiki refresh"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: monthly support docs LLMWiki refresh" \
            --body-file pr-body.md

      - name: No corpus changes
        if: steps.summary.outputs.has_changes != 'true'
        run: echo "No support-docs wiki changes to publish."
