name: Test auto-merge gate
on:
  pull_request:
    paths:
      - '.github/workflows/auto-merge.yml'
      - '.github/workflows/test-automerge.yml'
      - 'scripts/check_automerge_review.py'
      - 'tests/test_check_automerge_review.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python3 -m unittest discover -s tests -p 'test_check_automerge_review.py'
