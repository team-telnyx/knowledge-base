name: Verify website migration
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/utils/setup-runner
      - name: Test deployment logic without AWS
        run: python3 -m unittest discover -s website/scripts/deployment -p 'test_*.py'
      - name: Check source inventory
        run: python3 scripts/regenerate_support_docs_manifest.py --check
      - name: Build, test, and audit preview
        working-directory: website
        run: |
          bun run gen-content
          bun run type-check
          bun test
          bun run build
          bun run verify
      - name: Build and audit production indexing
        working-directory: website
        env:
          SITE_ORIGIN: "https://support.telnyx.com"
          SITE_INDEXABLE: "true"
        run: |
          bun run build
          bun run verify:strict
