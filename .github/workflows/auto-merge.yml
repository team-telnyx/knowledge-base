# Checklist gate for routine same-repository support-doc edits.
#
# Same-repository docs PRs qualify through author write access or a current-head
# approval from a code owner. Forks never run this job. All routes retain path,
# hold-label, review and CI gates. The App has the required-review bypass.
name: Auto-merge internal support-doc PRs

on:
  pull_request: # deliberately NOT pull_request_target
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push restarts the gate for the new head

env:
  ALLOWED_PREFIXES: "support-docs/ wiki/support-docs/ wiki/index.md"
  HOLD_LABEL: no-auto-merge
  CI_WAIT_MINUTES: "30"
  # Set to "true" to log the decision without merging (used while rolling out).
  DRY_RUN: "false"

jobs:
  gate-and-merge:
    name: Checklist gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      OWN_CHECK_NAME: Checklist gate
    steps:
      # Only trusted base-branch scripts are executed, never PR-head code.
      - name: Checkout base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check changed paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          git fetch origin "$HEAD_SHA"
          mapfile -t FILES < <(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed files — nothing to merge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r -a PREFIXES <<< "$ALLOWED_PREFIXES"
          DISALLOWED=()
          for f in "${FILES[@]}"; do
            ok=false
            for p in "${PREFIXES[@]}"; do
              if [[ "$f" == "$p"* ]]; then ok=true; break; fi
            done
            $ok || DISALLOWED+=("$f")
          done

          echo "Changed files (${#FILES[@]}):"
          printf '  %s\n' "${FILES[@]}"

          if [ "${#DISALLOWED[@]}" -gt 0 ]; then
            echo
            echo "Not eligible for auto-merge — paths outside [$ALLOWED_PREFIXES]:"
            printf '  %s\n' "${DISALLOWED[@]}"
            echo "A code owner reviews this PR as usual."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "All changed paths are under the allowed prefixes."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Check author or code-owner approval and holds
        id: hold
        if: steps.paths.outputs.proceed == 'true'
        run: python3 scripts/check_automerge_review.py >> "$GITHUB_OUTPUT"

      - name: Wait for the other checks to pass
        id: ci
        if: steps.hold.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE=$(( SECONDS + CI_WAIT_MINUTES * 60 ))
          # Give the other workflows a moment to register their check runs.
          sleep 60

          while :; do
            # Every check run on the head commit except this job's own.
            RUNS=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.OWN_CHECK_NAME)
                    | "\(.status)\t\(.conclusion // "")\t\(.name)"')
            # Legacy commit statuses (none today, but cheap to honour).
            STATUS_JSON=$(gh api "repos/$REPO/commits/$HEAD_SHA/status")
            STATUS_COUNT=$(jq -r '.total_count' <<< "$STATUS_JSON")
            STATUS_STATE=$(jq -r '.state' <<< "$STATUS_JSON")

            FAILED=$(awk -F'\t' '$3!="" && $1=="completed" && $2!="success" && $2!="skipped" && $2!="neutral" {print "  " $3 " (" $2 ")"}' <<< "$RUNS")
            PENDING=$(awk -F'\t' '$3!="" && $1!="completed" {print "  " $3 " (" $1 ")"}' <<< "$RUNS")
            TOTAL=$(grep -c . <<< "$RUNS" || true)

            if [ -n "$FAILED" ]; then
              echo "Checks did not pass — not auto-merging:"
              echo "$FAILED"
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$STATUS_COUNT" != "0" ] && [ "$STATUS_STATE" = "failure" ]; then
              echo "Commit status is failure — not auto-merging."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi

            if [ -z "$PENDING" ] && [ "$TOTAL" -gt 0 ] \
               && { [ "$STATUS_COUNT" = "0" ] || [ "$STATUS_STATE" = "success" ]; }; then
              echo "All $TOTAL other checks passed:"
              awk -F'\t' '{print "  " $3 " (" $2 ")"}' <<< "$RUNS"
              echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Timed out after $CI_WAIT_MINUTES minutes waiting for checks:"
              [ -n "$PENDING" ] && echo "$PENDING"
              [ "$TOTAL" -eq 0 ] && echo "  (no other check runs were registered)"
              echo "Leaving this PR to humans."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi

            echo "Waiting on:"
            if [ -n "$PENDING" ]; then echo "$PENDING"; else echo "  (no check runs registered yet)"; fi
            sleep 30
          done

      - name: Recheck eligibility after CI
        id: final-gate
        if: steps.ci.outputs.proceed == 'true'
        run: python3 scripts/check_automerge_review.py >> "$GITHUB_OUTPUT"

      - name: Dry run — report the decision only
        if: steps.final-gate.outputs.proceed == 'true' && env.DRY_RUN == 'true'
        run: echo "DRY_RUN is on — this PR would be auto-merged at $HEAD_SHA."

      - name: Mint merge token
        id: app-token
        if: steps.final-gate.outputs.proceed == 'true' && env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KB_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.KB_AUTOMERGE_APP_PRIVATE_KEY }}
          repositories: knowledge-base

      - name: Squash-merge
        if: steps.final-gate.outputs.proceed == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Abort if the head moved after the checks were evaluated.
          LIVE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,state \
                 --jq '"\(.state) \(.headRefOid)"')
          if [ "$LIVE" != "OPEN $HEAD_SHA" ]; then
            echo "PR changed since the checks were evaluated ($LIVE) — not merging."
            exit 0
          fi

          SUMMARY="Auto-merged by the checklist gate: eligible same-repository PR, support-docs only, all checks green (head $HEAD_SHA)."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --admin --match-head-commit "$HEAD_SHA" --body "$SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body ":white_check_mark: $SUMMARY"
          echo "$SUMMARY"
