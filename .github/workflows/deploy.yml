# NOTE: AWS_ASSUME_ROLE must be added to repo secrets.
name: Deploy - build and deploy to production

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "support-docs/**"

env:
  AWS_REGION: "us-east-1"
  # Optional: set this secret to invalidate the CloudFront cache after deploys.
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup runner
        uses: ./.github/utils/setup-runner

      - name: Generate content manifest
        working-directory: website
        run: bun run gen-content

      - name: Type check
        working-directory: website
        run: bun run type-check

      - name: Build the website
        working-directory: website
        env:
          BASE_PATH: "/"
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy files to bucket
        run: |
          # Route files under article/ and collection/ are extensionless HTML
          # copies of index.html (SPA deep-link support); sync would upload
          # them as application/octet-stream, so they are uploaded separately
          # with an explicit content type.
          aws s3 sync ./website/dist/ s3://support.telnyx.com/ \
            --delete \
            --exclude 'article/*' \
            --exclude 'collection/*' \
            --exclude 'en/*' \
            --cache-control 'public, must-revalidate' \
            --acl public-read
          for prefix in article collection en; do
            aws s3 sync ./website/dist/$prefix/ s3://support.telnyx.com/$prefix/ \
              --delete \
              --content-type 'text/html; charset=utf-8' \
              --cache-control 'public, must-revalidate' \
              --acl public-read
          done

      - name: Configure SPA fallback (S3 website error document)
        # Only applies when the site is served via the S3 website endpoint;
        # a CloudFront REST-origin setup needs a custom error response
        # (404 -> /404.html) configured on the distribution instead.
        # continue-on-error because the deploy role may lack
        # s3:PutBucketWebsite.
        continue-on-error: true
        run: |
          aws s3 website s3://support.telnyx.com/ \
            --index-document index.html \
            --error-document 404.html

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
