# NOTE: AWS_ASSUME_ROLE must be added to repo secrets.
name: Deploy - build and deploy to production

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "support-docs/**"

env:
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup runner
        uses: ./.github/utils/setup-runner

      - name: Generate content manifest
        working-directory: website
        run: bun run gen-content

      - name: Type check
        working-directory: website
        run: bun run type-check

      - name: Build the website
        working-directory: website
        env:
          BASE_PATH: "/"
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy files to bucket
        run: |
          aws s3 sync ./website/dist/ s3://support.telnyx.com/ \
            --cache-control 'public, must-revalidate' \
            --acl public-read
