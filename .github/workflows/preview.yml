# NOTE: AWS_ASSUME_ROLE must be added to repo secrets.
name: Review App - build and deploy PR Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "support-docs/**"

env:
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref }}

      - name: Setup runner
        uses: ./.github/utils/setup-runner

      - name: Generate content manifest
        working-directory: website
        run: bun run gen-content

      - name: Type check
        working-directory: website
        run: bun run type-check

      - name: Define deployment URL
        run: |
          FOLDER_NAME="pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}"
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
          echo "REVIEW_URL=https://support-v2.telnyx.com/$FOLDER_NAME/index.html" >> $GITHUB_ENV

      - name: Build the website
        working-directory: website
        env:
          BASE_PATH: "/${{ env.FOLDER_NAME }}"
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy files to bucket
        run: |
          aws s3 sync ./website/dist/ s3://support.telnyx.com/${{ env.FOLDER_NAME }}/ \
            --cache-control 'public, must-revalidate' \
            --acl public-read \
            --delete

      - name: Post comment on PR with deployed link
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const newUrl = process.env.REVIEW_URL;
            const body = `Your PR Preview is deployed! You can view it [here](${newUrl}).`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const isBot = (c) => c.user && (c.user.type === 'Bot' || /\[bot\]$/i.test(c.user.login || ''));
            const previewComments = comments.filter(c => isBot(c) && typeof c.body === 'string' && c.body.trim().startsWith('Your PR Preview'));

            const existing = previewComments.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

            if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
