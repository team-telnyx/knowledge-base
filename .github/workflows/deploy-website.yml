# NOTE: AWS_ASSUME_ROLE must be added to repo secrets.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: 'Optional prior successful main deployment run ID to restore generated content/routes'
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "support-docs/**"
      - ".github/workflows/deploy-website.yml"
      - ".github/utils/setup-runner/**"

# Serialize content upload, route writes, invalidation, verification and rollback.
# Never cancel an in-flight release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  CLOUDFRONT_KVS_ARN: ${{ vars.CLOUDFRONT_KVS_ARN }}
  AWS_STS_REGIONAL_ENDPOINTS: regional
  ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id || '' }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_ORIGIN: "https://support.telnyx.com"
      SITE_INDEXABLE: "true"

    steps:
      - name: Require approved main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = refs/heads/main

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup runner
        uses: ./.github/utils/setup-runner

      - name: Test deployment logic without AWS
        run: python3 -m unittest discover -s website/scripts/deployment -p 'test_*.py'

      - name: Generate content manifest
        working-directory: website
        run: bun run gen-content

      - name: Test website
        working-directory: website
        run: bun test

      - name: Type check
        working-directory: website
        run: bun run type-check

      - name: Build the website
        working-directory: website
        env:
          BASE_PATH: "/"
        run: bun run build

      - name: Verify rendered pages and links
        working-directory: website
        run: bun run verify:strict

      - name: Select a previous verified release for rollback
        if: inputs.rollback_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 website/scripts/deployment/select-rollback.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS target and snapshot prior routes
        run: |
          flags=()
          if [ -n "$ROLLBACK_RUN_ID" ]; then flags+=(--rollback); fi
          python3 website/scripts/deployment/release.py prepare "${flags[@]}"

      - name: Deploy files to bucket
        run: |
          BUCKET=s3://support.telnyx.com

          # 1) Content-hashed files first (long-lived, immutable), so the
          #    HTML uploaded later never references assets missing from the
          #    bucket.
          for prefix in assets _images downloads; do
            aws s3 sync ./website/dist/$prefix/ $BUCKET/$prefix/ \
              --cache-control 'public, max-age=31536000, immutable'
          done

          # 2) Article bodies — mutable JSON, revalidated on every request.
          aws s3 cp --recursive ./website/dist/content/ $BUCKET/content/ \
            --cache-control 'public, no-cache'

          # 3) Theme fonts (stable names, rarely change) get a day of cache.
          aws s3 cp --recursive ./website/dist/ $BUCKET/ \
            --exclude '*' \
            --include '*.woff' \
            --include '*.woff2' \
            --cache-control 'public, max-age=86400'

          # 4) Remaining root files (index.html, 404.html) — no-cache so a
          #    deploy takes effect immediately.
          aws s3 cp --recursive ./website/dist/ $BUCKET/ \
            --exclude 'assets/*' \
            --exclude '_images/*' \
            --exclude 'downloads/*' \
            --exclude 'content/*' \
            --exclude 'en/*' \
            --exclude '*.woff' \
            --exclude '*.woff2' \
            --cache-control 'public, no-cache'

          # 5) Complete prerendered pages at exact, extensionless keys.
          #    Upload separately because sync would guess
          #    application/octet-stream for files without extensions.
          for prefix in en; do
            aws s3 cp --recursive ./website/dist/$prefix/ $BUCKET/$prefix/ \
              --exclude '*.md' \
              --content-type 'text/html; charset=utf-8' \
              --cache-control 'public, no-cache'
            aws s3 cp --recursive ./website/dist/$prefix/ $BUCKET/$prefix/ \
              --exclude '*' --include '*.md' \
              --content-type 'text/markdown; charset=utf-8' \
              --cache-control 'public, no-cache'
          done

      # Retain superseded objects for redirects and rollback; never delete their
      # targets during a routing transition. Cleanup is a separate reviewed task.
      - name: Synchronize routes, invalidate, and verify release
        run: |
          flags=()
          if [ -n "$ROLLBACK_RUN_ID" ]; then flags+=(--rollback); fi
          python3 website/scripts/deployment/release.py publish "${flags[@]}"

      - name: Retain generated release and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: support-site-release-${{ github.run_id }}
          overwrite: true # A retry replaces this run's incomplete release artifact.
          path: |
            website/dist/
            website/dist-edge/
            website/release-report/
          retention-days: 90
          if-no-files-found: error
