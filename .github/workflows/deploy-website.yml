# NOTE: AWS_ASSUME_ROLE must be added to repo secrets.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: 'Optional prior successful main deployment run ID to restore generated content/routes'
        type: string
        default: ''
  push:
    branches:
      - main
    # Every main push reconciles production. A docs-only push may replace a
    # pending deployment, so path-filtering here can strand an older release.

# Serialize content upload, route writes, invalidation, verification and rollback.
# Never cancel an in-flight release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  CLOUDFRONT_KVS_ARN: ${{ vars.CLOUDFRONT_KVS_ARN }}
  AWS_STS_REGIONAL_ENDPOINTS: regional
  ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id || '' }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_ORIGIN: "https://support.telnyx.com"
      SITE_INDEXABLE: "true"

    steps:
      - name: Require approved main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = refs/heads/main

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Resolve main only after acquiring the production concurrency lock.
          # Event SHAs can arrive/run out of order.
          ref: main
          fetch-depth: 0

      - name: Record selected source revision
        run: |
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Selected main revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select a previous verified release for rollback
        if: inputs.rollback_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 website/scripts/deployment/select-rollback.py

      - name: Setup runner
        if: inputs.rollback_run_id == ''
        uses: ./.github/utils/setup-runner

      - name: Test deployment logic without AWS
        run: python3 -m unittest discover -s website/scripts/deployment -p 'test_*.py'

      - name: Generate content manifest
        if: inputs.rollback_run_id == ''
        working-directory: website
        run: bun run gen-content

      - name: Test website
        if: inputs.rollback_run_id == ''
        working-directory: website
        run: bun test

      - name: Type check
        if: inputs.rollback_run_id == ''
        working-directory: website
        run: bun run type-check

      - name: Build the website
        if: inputs.rollback_run_id == ''
        working-directory: website
        env:
          BASE_PATH: "/"
        run: bun run build

      - name: Verify rendered pages and links
        if: inputs.rollback_run_id == ''
        working-directory: website
        run: bun run verify:strict

      - name: Reject superseded build before production mutation
        if: inputs.rollback_run_id == ''
        run: python3 website/scripts/deployment/reconcile.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS target and snapshot prior routes
        run: |
          flags=()
          if [ -n "$ROLLBACK_RUN_ID" ]; then flags+=(--rollback); fi
          python3 website/scripts/deployment/release.py prepare "${flags[@]}"

      # Retain superseded objects for redirects and rollback; never delete their
      # targets during a routing transition. Cleanup is a separate reviewed task.
      - name: Upload content, synchronize routes, invalidate, and verify release
        run: |
          flags=()
          if [ -n "$ROLLBACK_RUN_ID" ]; then flags+=(--rollback); fi
          python3 website/scripts/deployment/release.py publish "${flags[@]}"

      - name: Retain generated release and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: support-site-release-${{ github.run_id }}
          overwrite: true # A retry replaces this run's incomplete release artifact.
          path: |
            website/dist/
            website/dist-edge/
            website/release-report/
          retention-days: 90
          if-no-files-found: error
