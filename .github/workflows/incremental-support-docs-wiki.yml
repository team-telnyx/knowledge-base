name: Incremental Support Docs Wiki Corpus

on:
  push:
    branches: [main]
    paths:
      - "support-docs/**"
      - "wiki/support-docs/articles/**"
      - "wiki/index.md"
      - "scripts/regenerate_support_docs_manifest.py"
      - "scripts/incremental_support_docs_wiki.py"
      - "scripts/detect_changed_support_docs.py"
      - "scripts/prepare_support_doc_artifacts.sh"
      - "tests/**"
      - ".github/workflows/incremental-support-docs-wiki.yml"
      - ".github/workflows/validate-support-docs.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional comparison base (all projections are reconciled regardless)"
        required: false
        default: ""

permissions:
  contents: read

# Each run reconciles the whole projection, so replacing an older pending run
# cannot silently drop an article from the generated corpus.
concurrency:
  group: incremental-support-docs-wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  incremental-support-docs-wiki:
    name: Open generated support-doc artifacts PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Select current main after acquiring the workflow concurrency lock.
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Test support-doc generation scripts
        run: python -m unittest discover -s tests
      - name: Generate support-doc artifacts
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.before }}
          HEAD_REF: HEAD
        run: bash scripts/prepare_support_doc_artifacts.sh
      - name: Open generated support-doc artifacts PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet -- support-docs/_manifest.json wiki/index.md wiki/support-docs/articles; then
            echo "No generated support-doc artifact changes to publish."
            exit 0
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          BRANCH="bot/incremental-support-docs-wiki-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "docs: update generated support-doc artifacts"
          git push -u origin "$BRANCH"
          {
            echo "Reconciles the generated support-doc manifest and article projections."
            echo
            echo "Source commit: $SOURCE_SHA"
            echo
            echo "This PR uses GITHUB_TOKEN. A maintainer must approve its workflow run before required checks can complete."
            echo
            echo '```'
            git show --stat --oneline HEAD
            echo '```'
          } > pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "docs: update generated support-doc artifacts" --body-file pr-body.md
